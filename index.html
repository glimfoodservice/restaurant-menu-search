<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲食店メニュー検索</title><style>body{font-family:system-ui,sans-serif;max-width:1200px;margin:auto;padding:24px;background:#f7f7f5;color:#222}h1{margin-bottom:6px}.bar{display:flex;gap:8px;flex-wrap:wrap;background:white;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}.bar input,.bar select,.bar button{padding:11px;border:1px solid #ddd;border-radius:9px}.bar button{background:#222;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:white;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}.wide{grid-column:1/-1}.menu{border-top:1px solid #eee;padding:12px 0}.muted{color:#777;font-size:13px}a{color:#245}ul{padding-left:20px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>飲食店メニュー検索</h1><div class="muted">食材 → 市場 → 競合 → 空白 → 新商品</div>
<div class="bar"><input id="ingredient" value="鯛,柚子" placeholder="食材（例：鯛,柚子）" size="28"><input id="pref" placeholder="都道府県"><input id="cuisine" placeholder="料理ジャンル"><input id="min" type="number" placeholder="最低価格"><input id="max" type="number" placeholder="最高価格"><button onclick="run()">市場を調べる</button><button onclick="ideas()">AIで5案</button></div>
<div id="kpi" class="grid"></div><div class="grid"><div class="card"><h3>ジャンル</h3><div id="cuisineDist"></div></div><div class="card"><h3>地域</h3><div id="regionDist"></div></div><div class="card"><h3>共起食材</h3><div id="co"></div></div><div class="card"><h3>空白シグナル</h3><div id="white"></div></div></div>
<div class="card wide"><h2>競合メニュー</h2><div id="menus"></div></div><div class="card wide"><h2>AI新商品5案</h2><div id="ideas"></div></div>
<script>const API=window.location.origin;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function j(path,opt){let r=await fetch(API+path,opt);let d=await r.json();if(!r.ok)throw Error(d.detail||'error');return d}
async function run(){try{let q=new URLSearchParams({ingredient:document.querySelector('#ingredient').value});['pref','cuisine','min','max'].forEach(id=>{let v=document.querySelector('#'+id).value;if(v)q.set({pref:'prefecture',cuisine:'cuisine',min:'min_price',max:'max_price'}[id],v)});let [m,s,w]=await Promise.all([j('/api/search?'+q),j('/api/market?ingredient='+encodeURIComponent(document.querySelector('#ingredient').value)),j('/api/whitespace?ingredient='+encodeURIComponent(document.querySelector('#ingredient').value))]);
$('kpi').innerHTML=[['メニュー数',s.menu_count],['平均価格',s.average_price? s.average_price.toLocaleString()+'円':'-'],['中央値',s.median_price?Math.round(s.median_price).toLocaleString()+'円':'-'],['価格帯',s.price_min?`${s.price_min.toLocaleString()}–${s.price_max.toLocaleString()}円`:'-']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><h2>${x[1]}</h2></div>`).join('');
$('cuisineDist').innerHTML=list(s.cuisine_distribution);$('regionDist').innerHTML=list(s.region_distribution);$('co').innerHTML=list(s.co_occurring_ingredients);$('white').innerHTML=list(w.signals);$('menus').innerHTML=m.items.map(x=>`<div class="menu"><b>${esc(x.name)}</b> ${x.price?esc(x.price)+'円':''}<br><span class="muted">${esc(x.restaurant)} / ${esc(x.prefecture)} / ${esc(x.cuisine_type)} / ${esc(x.ingredients)}</span><br>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">出典を見る</a>`:''}</div>`).join('')||'該当なし';}catch(e){alert(e.message)}}
function list(a){return (a||[]).slice(0,10).map(x=>`<div>${esc(x.label||x.dimension)} <b>${x.count}</b></div>`).join('')||'—'}
async function ideas(){try{let d=await j('/api/ideas?ingredient='+encodeURIComponent(document.querySelector('#ingredient').value),{method:'POST'});$('ideas').innerHTML=(d.ideas||[]).map(x=>`<div class="menu"><h3>${esc(x.name)}</h3><b>コンセプト</b> ${esc(x.concept)}<br><b>対象</b> ${esc(x.target)}<br><b>価格帯</b> ${esc(x.price_range)}<br><b>差別化</b> ${esc(x.differentiation)}<br><b>根拠</b> ${esc((x.basis||[]).join(' / '))}</div>`).join('')||esc(d.reason||'生成できませんでした');}catch(e){alert(e.message)}}function $(id){return document.getElementById(id)}run();</script></body></html>
